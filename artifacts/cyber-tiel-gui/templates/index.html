<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Tiel Coder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Cyber-Tiel Coder GUI</h1>
    <div id="status">Model: not loaded</div>
  </header>
  <main>
    <div id="chat"></div>
    <form id="form">
      <textarea id="prompt" placeholder="Describe the bug, paste code, or ask about a screenshot..."></textarea>
      <input type="file" id="image" accept="image/*">
      <div class="controls">
        <label>Max tokens <input type="number" id="max_tokens" value="2048"></label>
        <label>Temp <input type="number" id="temp" value="0.6" step="0.1"></label>
        <button type="submit">Send</button>
      </div>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
